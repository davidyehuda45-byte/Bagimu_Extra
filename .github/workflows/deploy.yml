name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: rizzzdev/bagimu-extra
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS with Traefik
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Sanitasi private key dari DOS carriage returns (\r)
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Bersihkan variabel dari trailing whitespace / newline
          CLEAN_HOST=$(echo "$SSH_HOST" | tr -d '\r\n' | xargs)
          CLEAN_PORT=$(echo "${SSH_PORT:-22}" | tr -d '\r\n' | xargs)
          CLEAN_USER=$(echo "$SSH_USER" | tr -d '\r\n' | xargs)
          CLEAN_PATH=$(echo "$PROJECT_PATH" | tr -d '\r\n' | xargs)

          # Scan host key
          ssh-keyscan -p "$CLEAN_PORT" -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Eksekusi deployment secara remote dengan native OpenSSH
          ssh -i ~/.ssh/deploy_key -p "$CLEAN_PORT" -o StrictHostKeyChecking=accept-new "$CLEAN_USER@$CLEAN_HOST" "bash -s" -- "$CLEAN_PATH" << 'EOF'
            set -e
            TARGET_DIR="$1"

            if [ -z "$TARGET_DIR" ]; then
              echo "ERROR: Target directory kosong. Pastikan secret VPS_PROJECT_PATH sudah diatur di GitHub Secrets."
              exit 1
            fi

            echo "==> Pindah ke direktori: $TARGET_DIR"
            eval cd "$TARGET_DIR"

            # Update repository jika menggunakan git di VPS
            if [ -d .git ]; then
              echo "==> Git pull file konfigurasi terbaru..."
              git pull origin main
            fi

            # Pastikan network proxy dan backend sudah aktif
            echo "==> Memastikan network Docker tersedia..."
            docker network create proxy 2>/dev/null || true
            docker network create backend 2>/dev/null || true

            # Pull image terbaru dari Docker Hub
            echo "==> Pulling image terbaru rizzzdev/bagimu-extra:latest..."
            docker compose pull

            # Jalankan container (migration dan seeder otomatis jalan via entrypoint.sh)
            echo "==> Menjalankan container dengan Docker Compose..."
            docker compose up -d --remove-orphans

            # Tunggu sesaat agar web server up
            echo "==> Menunggu container ready..."
            sleep 5

            # Sinkronkan file migrasi dan seeder dari image ke volume yang di-mount
            echo "==> Sinkronisasi migrasi dan seeder ke volume database..."
            docker compose exec -T bagimu-extra sh -c "if [ -d /var/www/html/database_files ]; then cp -rf /var/www/html/database_files/migrations/* /var/www/html/database/migrations/ 2>/dev/null || true; cp -rf /var/www/html/database_files/seeders/* /var/www/html/database/seeders/ 2>/dev/null || true; fi"

            # Jalankan migrasi dan seeder database secara eksplisit
            echo "==> Menjalankan migrasi database..."
            docker compose exec -T bagimu-extra php artisan migrate --force

            echo "==> Menjalankan seeder akun dan data awal..."
            docker compose exec -T -e ALLOW_PROD_SEED=true bagimu-extra php artisan db:seed --force || true

            # Pastikan akun admin David Yehuda Surbakti terdaftar dan aktif
            echo "==> Memastikan akun admin David Yehuda Surbakti aktif..."
            docker compose exec -T bagimu-extra php artisan app:create-admin --name="David Yehuda Surbakti" --email="david.yehuda45@smk.belajar.id" --username="davidyehudasurbakti" --password="Yehuda4545!"

            # Hapus akun admin demo cadangan demi keamanan
            echo "==> Menghapus akun admin demo bawaan..."
            docker compose exec -T bagimu-extra php artisan tinker --execute="App\Models\User::where('username', 'admin')->orWhere('email', 'admin@sekolah.sch.id')->delete();"

            # Optimasi cache Laravel (config, route, view)
            echo "==> Mengoptimalkan cache Laravel..."
            docker compose exec -T bagimu-extra php artisan optimize

            # Cek status kesehatan container
            echo "==> Memeriksa status container dan healthcheck..."
            docker compose ps bagimu-extra
          EOF
