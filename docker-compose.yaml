services:
  bagimu-extra:
    build:
      context: .
      dockerfile: Dockerfile
    image: rizzzdev/bagimu-extra:latest
    container_name: bagimu-extra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${PORT:-80}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=${DB_DATABASE:-/var/www/html/database/database.sqlite}
      - AUTO_MIGRATE=true
      - AUTO_SEED=true
      - ALLOW_PROD_SEED=true
    volumes:
      - bagimu-storage:/var/www/html/storage
      - bagimu-database:/var/www/html/database
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-80}/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bagimu-extra.rule=Host(`${ORIGIN}`)"
      - "traefik.http.routers.bagimu-extra.entrypoints=websecure"
      - "traefik.http.routers.bagimu-extra.tls.certresolver=myresolver"
      - "traefik.http.routers.bagimu-extra.priority=1"
      - "traefik.http.services.bagimu-extra.loadbalancer.server.port=${PORT}"

  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    image: rizzzdev/bagimu-extra:latest
    container_name: bagimu-extra-seeder
    profiles:
      - seed
    restart: "no"
    env_file:
      - .env
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_DATABASE=${DB_DATABASE:-/var/www/html/database/database.sqlite}
      - ALLOW_PROD_SEED=true
    volumes:
      - bagimu-storage:/var/www/html/storage
      - bagimu-database:/var/www/html/database
    networks:
      - backend
    command:
      - sh
      - -c
      - |
        echo "==> [1/2] Menjalankan migrasi database (idempotent)..."
        php artisan migrate --force
        echo "==> [2/2] Menjalankan seeder data awal (idempotent)..."
        php artisan db:seed --force
        echo "==> Migrasi dan seeder selesai!"

networks:
  backend:
    external: true
  proxy:
    external: true

volumes:
  bagimu-storage:
    name: bagimu-storage
  bagimu-database:
    name: bagimu-database
